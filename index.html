<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Vessel Rite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  /* Palette tokens. Each arc overrides these from the ARCS config below. */
  :root {
    color-scheme: dark;
    --room: #0d0907;
    --wood: #3a2217;
    --wood-hi: #5a3524;
    --panel: rgba(18, 12, 10, .86);
    --brass: #c9a063;
    --ink: #f3e6d2;
    --dim: #a8927a;
    --neon: #ff5c8a;
    --neon-2: #ffd0dc;
    --pick: #ffcf7a;
    --display: "Yellowtail", "Brush Script MT", cursive;
    --body: "Cormorant Garamond", Garamond, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--room); color: var(--ink); font-family: var(--body); font-size: 20px; overflow: hidden; }

  #bar { position: relative; height: 100%; overflow: hidden; }
  canvas#backbar { position: absolute; inset: 0; width: 100%; height: 100%; }
  .counter {
    position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
    background:
      linear-gradient(180deg, var(--wood-hi) 0, var(--wood) 7px, var(--wood) 12px, rgba(0,0,0,.35) 13px, var(--wood) 16px, #1c100b 100%);
    box-shadow: 0 -18px 40px rgba(0,0,0,.55);
  }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 35%, transparent 30%, rgba(0,0,0,.72) 100%); }

  /* Neon sign */
  .sign {
    position: absolute; top: calc(22px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none;
    transition: transform .8s ease, opacity .8s ease;
  }
  .sign .name {
    font-family: var(--display); font-size: clamp(44px, 10vw, 84px); line-height: 1;
    color: var(--neon-2);
    text-shadow: 0 0 4px var(--neon-2), 0 0 12px var(--neon), 0 0 28px var(--neon), 0 0 56px var(--neon);
    animation: buzz 7s infinite;
  }
  .sign .sub { font-family: var(--mono); font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--brass); opacity: .85; }
  @keyframes buzz { 0%, 91%, 95%, 100% { opacity: 1; } 92% { opacity: .35; } 93% { opacity: .9; } 94% { opacity: .5; } }
  .sign.small { transform: scale(.62) translateY(-18px); }

  /* Title card */
  .door {
    position: absolute; inset: 0; display: grid; place-items: center; padding-inline: 16px; z-index: 3;
    transition: opacity .9s ease;
  }
  .door .inner { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; margin-top: 12vh; }
  .door p { margin: 0; font-style: italic; color: var(--dim); font-size: 22px; max-width: 30ch; }
  .enter {
    all: unset; cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--ink); border: 1px solid var(--brass); padding: 12px 22px;
  }
  .enter:hover, .enter:focus-visible { background: var(--brass); color: var(--room); }
  .door.gone { opacity: 0; pointer-events: none; }

  /* Conversation card, resting on the counter */
  .talk {
    position: absolute; left: 16px; right: 16px; bottom: calc(9% + env(safe-area-inset-bottom, 0px));
    margin-inline: auto; width: min(680px, calc(100% - 32px));
    background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--brass) 55%, transparent);
    outline: 1px solid color-mix(in srgb, var(--brass) 18%, transparent); outline-offset: 4px;
    padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 16px; z-index: 2;
    backdrop-filter: blur(3px);
    max-height: 68%; overflow-y: auto;
    transition: opacity .6s ease;
  }
  .talk.fading { opacity: 0; }
  .talk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .speaker, .round { font-family: var(--mono); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
  .speaker { color: var(--brass); }
  .round { color: var(--dim); font-variant-numeric: tabular-nums; }
  .line { font-size: clamp(22px, 4.6vw, 28px); line-height: 1.3; min-height: 2.6em; text-wrap: pretty; white-space: pre-wrap; }
  .caret { color: var(--brass); font-size: .7em; margin-left: .3em; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .choices { display: flex; flex-direction: column; }
  .choice {
    all: unset; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; align-items: baseline;
    font-size: clamp(19px, 4vw, 23px); color: var(--dim); padding: 7px 0;
    border-top: 1px dashed color-mix(in srgb, var(--brass) 22%, transparent);
  }
  .choice:first-child { border-top: 0; }
  .choice .mark { color: var(--pick); font-size: 12px; visibility: hidden; }
  .choice[aria-selected="true"], .choice:hover { color: var(--pick); }
  .choice[aria-selected="true"] .mark { visibility: visible; }
  .choice:focus-visible { outline: 1px dashed var(--pick); outline-offset: 3px; }

  .entry { display: flex; flex-direction: column; gap: 10px; }
  .entry input, .entry textarea {
    font: inherit; font-size: clamp(20px, 4.2vw, 24px); color: var(--pick); background: transparent;
    border: 0; border-bottom: 1px solid color-mix(in srgb, var(--brass) 45%, transparent);
    padding: 6px 0; outline: none; width: 100%; resize: none; caret-color: var(--pick);
  }
  .entry input::placeholder, .entry textarea::placeholder { color: color-mix(in srgb, var(--dim) 60%, transparent); font-style: italic; }
  .entry input:focus, .entry textarea:focus { border-bottom-color: var(--pick); }
  .entry-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hint { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .go { all: unset; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--brass); padding: 8px 14px; }
  .go:hover, .go:focus-visible { background: var(--brass); color: var(--room); }
  .go[disabled] { opacity: .3; pointer-events: none; }

  /* Sound toggle */
  #sound {
    all: unset; cursor: pointer; position: fixed; z-index: 6;
    right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
    padding: 6px 8px;
  }
  #sound:hover, #sound:focus-visible { color: var(--pick); }

  /* Final screen */
  .end { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: #000; padding-inline: 16px; opacity: 0; transition: opacity 2.6s ease; }
  .end.shown { opacity: 1; }
  .end p { margin: 0; font-size: clamp(24px, 5vw, 34px); font-style: italic; color: #efe7dc; text-align: center; }
  .fallback { position: absolute; bottom: 24px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
  .fallback p { font-size: 17px; font-style: normal; color: #8a8178; }
  .fallback button { all: unset; cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #8a8178; border: 1px solid #3a3530; padding: 6px 10px; }

  /* Host-only responses panel */
  #keeperBtn {
    all: unset; cursor: pointer; position: fixed; z-index: 6;
    top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--dim); border: 1px solid color-mix(in srgb, var(--brass) 40%, transparent); padding: 6px 10px; background: var(--room);
  }
  #keeperBtn:hover, #keeperBtn:focus-visible { color: var(--pick); border-color: var(--pick); }
  #keeper { position: fixed; inset: 0; z-index: 10; background: var(--room); overflow-y: auto;
    padding-inline: 16px; padding-block: calc(60px + env(safe-area-inset-top, 0px)) 40px; }
  #keeper .wrap { width: min(760px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  #keeper h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 44px; color: var(--neon-2); text-shadow: 0 0 14px var(--neon); }
  #keeper .note { margin: 0; color: var(--dim); font-style: italic; }
  #closeKeeper { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; }
  .rec { border-top: 1px solid color-mix(in srgb, var(--brass) 30%, transparent); padding-top: 12px; }
  .rec summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; list-style: none; }
  .rec summary::-webkit-details-marker { display: none; }
  .rec .who { font-size: 26px; font-weight: 600; }
  .rec .when { font-family: var(--mono); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .qa { padding-block: 8px; display: flex; flex-direction: column; gap: 2px; }
  .qa .q { color: var(--dim); font-size: 17px; font-style: italic; }
  .qa .a { color: var(--pick); font-size: 21px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px; }
  .tools button { all: unset; cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); border: 1px solid color-mix(in srgb, var(--brass) 35%, transparent); padding: 5px 9px; }
  .tools button:hover { color: var(--pick); border-color: var(--pick); }

  @media (max-width: 520px) {
    .talk { padding: 20px 18px 18px; bottom: calc(5% + env(safe-area-inset-bottom, 0px)); max-height: 72%; }
    .sign.small { transform: scale(.55) translateY(-26px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sign .name, .caret { animation: none; }
    .talk, .door, .end, .sign { transition: none; }
  }
</style>

</head>
<body>
<div id="bar">
  <canvas id="backbar" aria-hidden="true"></canvas>
  <div class="counter" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="sign" id="sign">
    <div class="name" id="barName"></div>
    <div class="sub" id="barSub"></div>
  </div>

  <div class="door" id="door">
    <div class="inner">
      <p id="doorLine"></p>
      <button class="enter" id="enter" type="button">Take a seat</button>
    </div>
  </div>

  <div class="talk" id="talk" hidden aria-live="polite">
    <div class="talk-head">
      <span class="speaker" id="speaker"></span>
      <span class="round" id="round"></span>
    </div>
    <div class="line" id="line"></div>
    <div id="input"></div>
  </div>
</div>

<audio id="music" loop preload="auto"></audio>
<button id="sound" type="button" hidden>Sound on</button>

<script>
/* ================================================================
   ARCS — one entry per season/arc. Switch ACTIVE_ARC to change the
   whole look (colors, sign, bartender, bottles, song).
   ================================================================ */
const ACTIVE_ARC = "season1";

/* Paste your Discord webhook URL between the quotes. */
const WEBHOOK_URL = "https://discord.com/api/webhooks/1552326729048133743/dY4yjr8YeQZvecTx2SD5VmamxiaFR9sFBtjv9nPR5BseGIL_KdFnBQxM5VIDzEDNd7KR";

const ARCS = {
  season1: {
    barName: "Last Call",
    subtitle: "Open until the question is answered",
    doorLine: "The door swings shut behind you. Somewhere, a record is already playing.",
    bartender: "The Barkeep",
    song: "stray-sheep.mp3",
    colors: {
      room: "#0d0907", wood: "#3a2217", woodHi: "#5a3524", panel: "rgba(18,12,10,.86)",
      brass: "#c9a063", ink: "#f3e6d2", dim: "#a8927a",
      neon: "#ff5c8a", neon2: "#ffd0dc", pick: "#ffcf7a",
    },
    bottles: ["#d9822b", "#7fb069", "#c94f4f", "#e8c26a", "#5a8fb0", "#b27ab8"],
  },
};

/* ================================================================
   SCRIPT — plays top to bottom.
   - A plain string is the barkeep talking.
   - A string wrapped in *asterisks* is narration (shown in italics).
   - An object is a question: type "text" (typed) or "choice" (pick one).
     "after" lets the barkeep reply to a specific answer.
   ================================================================ */
const YN = ["Yes", "No"];
const SCRIPT = [
  "Evenin', fella. You seem to be coming around here more and more often. Take a seat.",
  "*He casually eyes the glass he was wiping down, before turning his eyes to you.*",
  "...Say, I've seen you around this bar for years with all your friends. Even lovers, occasionally.",
  "But I haven't really gotten to know you, now have I?",

  { id: "name", type: "text", prompt: "What is your name?", placeholder: "Your name" },
  { id: "promise", type: "choice", prompt: "Do you promise to answer truthfully to all these questions?", options: YN },
  "Nice, then. Let's begin.",

  { id: "secret", type: "choice", prompt: "A friend of yours has a dark secret that they share with you. It can potentially hurt people if left unchecked. What do you do?",
    options: ["As long as it's not me, who cares?", "Honesty is the best policy, even if they hate me for it.", "They trusted me enough to keep it secret, I would never tell anyone.", "I'm not sure."] },
  { id: "partner", type: "choice", prompt: "You have been with your longterm partner for years, but you feel that you are losing feelings. What do you do?",
    options: ["Rip the bandaid off. They deserve better, and so do I.", "Love can survive ANYTHING! We'll make it work.", "I'll talk to them about it before making any rash decisions.", "Mundane days are the best days. We'll keep living as we are."] },
  { id: "overtime", type: "choice", prompt: "Your boss has been constantly calling you in for overtime, and eventually the overtime checks stop coming in. What do you do?",
    options: ["Drop the job and find a new one. Lawsuit galore!", "Stop coming in for overtime. The money is water under the bridge...", "Confront them directly about it. The money isn't the value, it's the integrity.", "Say nothing, and keep working regardless."] },
  { id: "value", type: "text", prompt: "What do you value the most in life?", placeholder: "Take your time", long: true },
  { id: "career_love", type: "choice", prompt: "What comes first, your career or your love life?", options: ["My career", "My love life", "They're equal", "Neither"] },
  { id: "friends_first", type: "choice", prompt: "Do you value your friends above anything?", options: ["Yes", "No", "It depends"] },
  { id: "many_friends", type: "choice", prompt: "Would you say you have many friends?", options: ["Yes", "No", "A few close ones"] },
  { id: "social", type: "choice", prompt: "Do you consider yourself a social person?", options: ["Yes", "No", "Depends on the crowd"] },
  { id: "ideation", type: "choice", prompt: "Have you ever had thoughts about suicidal ideation?", options: ["Yes", "No", "I'd rather not say"],
    },
  { id: "good", type: "choice", prompt: "Are you a good person?", options: ["Yes", "No", "I'm trying"] },
  { id: "sin", type: "choice", prompt: "Which of the Seven Sins best describe you?", options: ["Pride", "Greed", "Wrath", "Envy", "Lust", "Gluttony", "Sloth"] },
  { id: "love_language", type: "choice", prompt: "What is your preferred love language?", options: ["Words of affirmation", "Quality time", "Acts of service", "Receiving gifts", "Physical touch"] },
  { id: "overachiever", type: "choice", prompt: "Do you consider yourself an overachiever?", options: ["Yes", "No", "Sometimes"] },
  { id: "homicidal", type: "choice", prompt: "Have you ever had homicidal/murderous thoughts?", options: ["Yes", "No", "I'd rather not say"] },
  { id: "taboo", type: "choice", prompt: "Do you have any taboo fantasies?", options: ["Yes", "No", "I'd rather not say"] },
  { id: "damned", type: "choice", prompt: "By completing this form, you acknowledge the fact that you and all your friends may be damned to hell.", options: YN },

  "Riiight. One scotch, coming right up.",
];

const THANK_YOU = "Thank you for your participation.";
/* ================================================================ */

const $ = (id) => document.getElementById(id);
const arc = ARCS[ACTIVE_ARC];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ---------- apply the arc ---------- */
(function applyArc() {
  const c = arc.colors, s = document.documentElement.style;
  const map = { room: "--room", wood: "--wood", woodHi: "--wood-hi", panel: "--panel", brass: "--brass",
    ink: "--ink", dim: "--dim", neon: "--neon", neon2: "--neon-2", pick: "--pick" };
  for (const k in map) if (c[k]) s.setProperty(map[k], c[k]);
  $("barName").textContent = arc.barName;
  $("barSub").textContent = arc.subtitle;
  $("doorLine").textContent = arc.doorLine;
  $("speaker").textContent = arc.bartender;
  $("music").src = arc.song;
})();

/* ---------- back bar: shelves, bottles, lamp glow ---------- */
(function backbar() {
  const cv = $("backbar"), ctx = cv.getContext("2d");
  let w, h, bottles = [], glints = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const layout = () => {
    const d = devicePixelRatio || 1;
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * d; cv.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    bottles = []; glints = [];
    const shelves = [h * .34, h * .52, h * .70];
    for (const y of shelves) {
      let x = rnd(-10, 20);
      while (x < w) {
        const bw = rnd(14, 26), bh = rnd(46, 92) * Math.min(1, h / 800 + .3);
        bottles.push({ x, y, bw, bh, col: arc.bottles[Math.floor(Math.random() * arc.bottles.length)], a: rnd(.35, .8) });
        if (Math.random() < .5) glints.push({ x: x + bw * .3, y: y - bh * .6, r: rnd(2, 5), p: rnd(0, 6.28), s: rnd(.004, .012) });
        x += bw + rnd(6, 22);
      }
    }
    cv._shelves = shelves;
  };
  let still = null;
  const paintStill = () => {
    const d = devicePixelRatio || 1;
    still = document.createElement("canvas"); still.width = w * d; still.height = h * d;
    const c = still.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0);
    const bg = c.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, arc.colors.room); bg.addColorStop(.55, "#1a110c"); bg.addColorStop(1, arc.colors.room);
    c.fillStyle = bg; c.fillRect(0, 0, w, h);
    for (const lx of [w * .2, w * .5, w * .8]) {
      const g = c.createRadialGradient(lx, h * .18, 0, lx, h * .18, Math.max(w, h) * .45);
      g.addColorStop(0, "rgba(255,190,110,.20)"); g.addColorStop(1, "rgba(255,190,110,0)");
      c.fillStyle = g; c.fillRect(0, 0, w, h);
    }
    c.save(); c.filter = "blur(2.5px)";
    for (const b of bottles) {
      c.globalAlpha = b.a; c.fillStyle = b.col;
      const neck = b.bw * .34, top = b.y - b.bh;
      c.beginPath();
      c.roundRect(b.x, top + b.bh * .32, b.bw, b.bh * .68, 4);
      c.roundRect(b.x + (b.bw - neck) / 2, top, neck, b.bh * .36, 2);
      c.fill();
    }
    c.restore(); c.globalAlpha = 1;
    for (const y of cv._shelves) {
      c.fillStyle = "rgba(0,0,0,.55)"; c.fillRect(0, y, w, 8);
      c.fillStyle = "rgba(201,160,99,.28)"; c.fillRect(0, y, w, 1.5);
    }
  };
  let last = 0;
  const draw = (t = 0) => {
    if (!reduce) requestAnimationFrame(draw);
    if (t - last < 50) return; last = t;   // ~20fps is plenty for a slow shimmer
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(still, 0, 0);
    ctx.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
    // glints
    for (const g of glints) {
      g.p += g.s;
      ctx.fillStyle = `rgba(255,236,200,${.12 + .35 * Math.sin(g.p) ** 2})`;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
    }
  };
  layout(); paintStill();
  addEventListener("resize", () => { layout(); paintStill(); last = 0; if (reduce) draw(1e9); });
  draw(1e9);
})();

/* ---------- music ---------- */
const music = $("music"), soundBtn = $("sound");
let muted = false, fadeTimer = null;
function fadeTo(target, ms = 1500) {
  clearInterval(fadeTimer);
  const start = music.volume, t0 = performance.now();
  fadeTimer = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    music.volume = start + (target - start) * k;
    if (k >= 1) clearInterval(fadeTimer);
  }, 50);
}
async function startMusic() {
  music.volume = 0;
  try { await music.play(); fadeTo(.55, 2500); } catch { /* the viewer can press Sound on */ }
  soundBtn.hidden = false; syncSound();
}
function syncSound() { soundBtn.textContent = muted || music.paused ? "♪ Sound off" : "♪ Sound on"; }
soundBtn.addEventListener("click", async (e) => {
  e.stopPropagation();
  if (music.paused) { muted = false; music.volume = .55; try { await music.play(); } catch {} }
  else { muted = !muted; music.muted = muted; }
  syncSound();
});

/* ---------- typewriter ---------- */
const lineEl = $("line"), inputEl = $("input"), roundEl = $("round"), talkEl = $("talk");
let skipTyping = false;
async function type(text) {
  const narr = /^\*.*\*$/s.test(text);
  if (narr) text = text.slice(1, -1);
  lineEl.style.fontStyle = narr ? "italic" : "";
  lineEl.style.color = narr ? "var(--dim)" : "";
  lineEl.textContent = ""; skipTyping = false;
  if (reduce) { lineEl.textContent = text; return; }
  for (let i = 0; i < text.length; i++) {
    if (skipTyping) { lineEl.textContent = text; break; }
    lineEl.textContent = text.slice(0, i + 1);
    await sleep(".,!?".includes(text[i]) ? 200 : 30);
  }
}
function waitForAdvance() {
  return new Promise(res => {
    const caret = document.createElement("span"); caret.className = "caret"; caret.textContent = "◆";
    lineEl.appendChild(caret);
    const done = (e) => {
      if (e.type === "keydown" && !["Enter", " "].includes(e.key)) return;
      e.preventDefault?.();
      removeEventListener("keydown", done); $("bar").removeEventListener("click", done);
      caret.remove(); res();
    };
    setTimeout(() => { addEventListener("keydown", done); $("bar").addEventListener("click", done); }, 120);
  });
}
addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") skipTyping = true; });
$("bar").addEventListener("click", () => { skipTyping = true; });
async function say(text) { inputEl.replaceChildren(); await type(text); await waitForAdvance(); }

/* ---------- answers ---------- */
function askChoice(q) {
  return new Promise(res => {
    const list = document.createElement("div"); list.className = "choices"; list.setAttribute("role", "listbox");
    let idx = 0;
    const btns = q.options.map((opt, i) => {
      const b = document.createElement("button");
      b.className = "choice"; b.type = "button"; b.id = `opt-${q.id}-${i}`; b.setAttribute("role", "option");
      const m = document.createElement("span"); m.className = "mark"; m.textContent = "◆";
      const t = document.createElement("span"); t.textContent = opt;
      b.append(m, t);
      b.addEventListener("mouseenter", () => select(i));
      b.addEventListener("click", (e) => { e.stopPropagation(); finish(i); });
      list.appendChild(b); return b;
    });
    const select = (i) => { idx = i; btns.forEach((b, j) => b.setAttribute("aria-selected", j === i)); };
    const key = (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); select((idx + 1) % btns.length); btns[idx].focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); select((idx - 1 + btns.length) % btns.length); btns[idx].focus(); }
      else if (e.key === "Enter") { e.preventDefault(); finish(idx); }
    };
    let done = false;
    const finish = (i) => { if (done) return; done = true; removeEventListener("keydown", key); res(q.options[i]); };
    select(0); inputEl.replaceChildren(list);
    btns[0].focus({ preventScroll: true });
    setTimeout(() => addEventListener("keydown", key), 150);
  });
}
function askText(q) {
  return new Promise(res => {
    const wrap = document.createElement("div"); wrap.className = "entry";
    const field = document.createElement(q.long ? "textarea" : "input");
    field.id = `ans-${q.id}`; field.placeholder = q.placeholder || ""; field.maxLength = q.long ? 600 : 80;
    field.setAttribute("aria-label", q.prompt); if (q.long) field.rows = 3;
    const foot = document.createElement("div"); foot.className = "entry-foot";
    const hint = document.createElement("span"); hint.className = "hint";
    hint.textContent = q.long ? "Shift + Enter for a new line" : "Enter to answer";
    const go = document.createElement("button"); go.className = "go"; go.type = "button"; go.textContent = "Answer"; go.disabled = true;
    field.addEventListener("input", () => { go.disabled = !field.value.trim(); });
    field.addEventListener("click", e => e.stopPropagation());
    field.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (field.value.trim()) res(field.value.trim()); }
    });
    go.addEventListener("click", (e) => { e.stopPropagation(); res(field.value.trim()); });
    foot.append(hint, go); wrap.append(field, foot);
    inputEl.replaceChildren(wrap);
    field.focus({ preventScroll: true });
  });
}

/* ---------- saving: posts each finished form to your Discord channel ---------- */
async function save(record) {
  if (!WEBHOOK_URL || !WEBHOOK_URL.startsWith("https://")) return false;
  const clip = (t, n) => (t.length > n ? t.slice(0, n - 1) + "…" : t);
  const fields = record.answers.filter(a => a.id !== "name").map(a => ({
    name: clip(a.prompt, 250), value: clip(a.answer || "—", 1000),
  }));
  const body = {
    username: arc.bartender,
    allowed_mentions: { parse: [] },   // players can't ping @everyone
    embeds: [{
      title: clip(`New patron: ${record.name || "Unnamed"}`, 250),
      color: 0xc9a063,
      fields: fields.slice(0, 25),
      footer: { text: `Arc: ${record.arc}` },
      timestamp: record.submittedAt,
    }],
  };
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch(WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.ok) return true;
    } catch {}
    await sleep(1200);
  }
  return false;
}
const transcript = (r) => r.answers.map(a => `${a.prompt}\n> ${a.answer}`).join("\n\n");

async function ending(record, saved) {
  talkEl.classList.add("fading");
  if (!music.paused) fadeTo(0, 3200);
  await sleep(reduce ? 0 : 700);
  const end = document.createElement("div"); end.className = "end";
  const p = document.createElement("p"); p.textContent = THANK_YOU; end.appendChild(p);
  if (!saved) {
    const fb = document.createElement("div"); fb.className = "fallback";
    const msg = document.createElement("p"); msg.textContent = "Your answers couldn't be sent automatically. Copy them and send them to your host.";
    const btn = document.createElement("button"); btn.type = "button"; btn.textContent = "Copy my answers";
    btn.addEventListener("click", async () => {
      const text = transcript(record);
      try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
      catch { const t = document.createElement("textarea"); t.value = text; t.readOnly = true;
        t.style.cssText = "width:100%;height:8em;background:#000;color:#8a8178;border:1px solid #3a3530;font:inherit;font-size:16px";
        fb.appendChild(t); t.select(); btn.hidden = true; }
    });
    fb.append(msg, btn); end.appendChild(fb);
  }
  document.body.appendChild(end);
  soundBtn.hidden = true;
  requestAnimationFrame(() => requestAnimationFrame(() => end.classList.add("shown")));
  setTimeout(() => music.pause(), 3400);
}

/* ---------- the evening ---------- */
async function run() {
  $("door").classList.add("gone");
  $("sign").classList.add("small");
  startMusic();
  await sleep(reduce ? 0 : 900);
  talkEl.hidden = false;
  const total = SCRIPT.filter(x => typeof x === "object").length;
  const log = []; let n = 0; let saving = null;
  for (let i = 0; i < SCRIPT.length; i++) {
    const step = SCRIPT[i];
    if (typeof step === "string") { roundEl.textContent = n && n < total ? roundEl.textContent : ""; await say(step); continue; }
    n++;
    roundEl.textContent = `Round ${n} of ${total}`;
    inputEl.replaceChildren();
    await type(step.prompt);
    const a = step.type === "choice" ? await askChoice(step) : await askText(step);
    log.push({ id: step.id, prompt: step.prompt, answer: a });
    inputEl.replaceChildren();
    if (step.after && step.after[a]) await say(step.after[a]);
    if (n === total) {
      roundEl.textContent = "";
      const record = { name: log.find(x => x.id === "name")?.answer || "", arc: ACTIVE_ARC, answers: log, submittedAt: new Date().toISOString() };
      saving = save(record).then(ok => ({ ok, record }));
    }
  }
  const { ok, record } = await saving;
  await ending(record, ok);
}
$("enter").addEventListener("click", (e) => { e.stopPropagation(); run(); }, { once: true });

</script>
